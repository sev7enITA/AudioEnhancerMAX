name: AudioEnhancerCompanion
options:
  bundleIdPrefix: com.fabriziodegni.audioenhancermax
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '4.0.0'
    CURRENT_PROJECT_VERSION: '8'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: 'Scan the private pairing QR code displayed by AudioEnhancerMAX on your Mac. Images stay on this device and are not saved.'
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'Find your Mac, transfer audio, retrieve results, or contribute processing while this app is open.'
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    CODE_SIGNING_ALLOWED: YES
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  AudioEnhancerCompanion:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSBonjourServices: ['_aemax-pair._tcp']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabriziodegni.audioenhancermax.companion
        INFOPLIST_KEY_CFBundleDisplayName: AudioEnhancer
  CompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AudioEnhancerCompanion
schemes:
  AudioEnhancerCompanion:
    build:
      targets:
        AudioEnhancerCompanion: all
    test:
      targets: [CompanionTests]
