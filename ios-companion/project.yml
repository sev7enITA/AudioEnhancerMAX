name: AudioEnhancerCompanion
options:
  bundleIdPrefix: com.fabriziodegni.audioenhancermax
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '4.1.0'
    CURRENT_PROJECT_VERSION: '12'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: 'Scan the private pairing QR code displayed by AudioEnhancerMAX on your Mac. Images stay on this device and are not saved.'
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'Pair with your Mac, transfer audio, retrieve results, or contribute processing while this app is open.'
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    CODE_SIGNING_ALLOWED: YES
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
packages:
  C2PA:
    url: https://github.com/contentauth/c2pa-swift.git
    exactVersion: 0.1.0
targets:
  AudioEnhancerCompanion:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - path: ../app/resources/c2pa
        buildPhase: resources
      - path: ../app/resources/mobile
        buildPhase: resources
    dependencies:
      - package: C2PA
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSBonjourServices: ['_aemax-pair._tcp', '_aemax-phone._udp']
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: AudioEnhancerMAX Verification Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: ['com.microsoft.waveform-audio', 'public.mp3', 'org.xiph.flac', 'com.apple.m4a-audio', 'public.mpeg-4', 'com.apple.quicktime-movie']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabriziodegni.audioenhancermax.companion
        INFOPLIST_KEY_CFBundleDisplayName: AudioEnhancer
  CompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: ../web/c2pa/v4.0.0-beta.1
        buildPhase: resources
    dependencies:
      - target: AudioEnhancerCompanion
schemes:
  AudioEnhancerCompanion:
    build:
      targets:
        AudioEnhancerCompanion: all
    test:
      targets: [CompanionTests]
